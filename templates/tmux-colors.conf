set -g status-style "fg={{ink-muted}},bg={{panel-base}}"
set -g status-left-style "fg={{accent}},bg={{panel-base}}"
set -g status-right-style "fg={{ink-muted}},bg={{panel-base}}"
set -g window-status-style "fg={{ink-muted}},bg={{panel-base}}"
set -g window-status-current-style "fg={{ink-emphasis}},bg={{surface-raised}}"
set -g window-status-activity-style "fg={{warning}},bg={{panel-base}}"
set -g message-style "fg={{ink}},bg={{surface-raised}}"
set -g message-command-style "fg={{ink}},bg={{surface-raised}}"
set -g pane-border-style "fg={{ink-faint-solid}}"
set -g pane-active-border-style "fg={{accent}}"
set -g mode-style "fg={{ink-on-accent}},bg={{accent}}"
set -g copy-mode-match-style "fg={{ink-on-accent}},bg={{accent}}"
set -g copy-mode-current-match-style "fg={{ink-on-accent}},bg={{accent-soft}}"
set -g clock-mode-colour "{{accent}}"
